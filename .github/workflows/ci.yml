name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Tests (isolated roots, no research data)
        run: |
          export FORMIAI_RESEARCH_ROOT="$RUNNER_TEMP/research"
          export FORMIAI_DATA_DIR="$RUNNER_TEMP/data"
          mkdir -p "$FORMIAI_RESEARCH_ROOT" "$FORMIAI_DATA_DIR"
          uv run pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install ffmpeg (synthetic test clip)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser sync suite (mocked API)
        run: npm run test:sync
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
